<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mahlzeit &ndash; Rezept &ouml;ffnen</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #F7F2EA;
    --fg: #2B2119;
    --accent: #A6431C;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171310;
      --fg: #ECE4D8;
      --accent: #D0703F;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main {
    max-width: 420px;
    width: 100%;
    text-align: center;
  }
  h1 {
    font-size: 1.6rem;
    margin: 0 0 8px;
  }
  p.sub {
    margin: 0 0 24px;
    opacity: 0.75;
    font-size: 0.95rem;
  }
  p.explain {
    margin: 0 0 28px;
    line-height: 1.5;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    min-width: 200px;
    padding: 12px 24px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  .testflight {
    display: block;
    margin-top: 16px;
    color: var(--accent);
    text-decoration: underline;
    font-size: 0.9rem;
  }
  .note {
    display: block;
    margin-top: 4px;
    font-size: 0.8rem;
    opacity: 0.6;
  }
  #fallback { display: none; }
</style>
</head>
<body>
<main>
  <div id="loading">
    <h1 id="loading-title"></h1>
  </div>

  <div id="fallback">
    <h1 id="fallback-title">Mahlzeit</h1>
    <p class="sub" id="fallback-sub"></p>
    <p class="explain" id="explain"></p>
    <a class="btn" id="retry" href="#"></a>
    <a class="testflight" href="#">TestFlight</a>
    <span class="note" id="note"></span>
  </div>
</main>

<script>
  (function () {
    // One language, picked from the reader's browser (German or English).
    var de = /^de(-|$)/i.test((navigator.languages && navigator.languages[0]) || navigator.language || '');
    var T = de ? {
      title: 'Mahlzeit – Rezept öffnen',
      loading: 'Mahlzeit wird geöffnet…',
      sub: 'Rezepte & Haushalt',
      explain: 'Dieser Link öffnet ein geteiltes Rezept in der Mahlzeit-App.',
      open: 'In der App öffnen',
      note: 'TestFlight-Link folgt',
      invalidTitle: 'Ungültiger Link',
      invalid: 'Dieser Link ist ungültig oder unvollständig.'
    } : {
      title: 'Mahlzeit – Open recipe',
      loading: 'Opening Mahlzeit…',
      sub: 'Recipe & household app',
      explain: 'This link opens a shared recipe in the Mahlzeit app.',
      open: 'Open in app',
      note: 'TestFlight link coming soon',
      invalidTitle: 'Invalid link',
      invalid: 'This link is invalid or incomplete.'
    };
    document.documentElement.lang = de ? 'de' : 'en';
    document.title = T.title;
    function set(id, text) { document.getElementById(id).textContent = text; }
    set('loading-title', T.loading);
    set('fallback-sub', T.sub);
    set('explain', T.explain);
    set('retry', T.open);
    set('note', T.note);

    var token = location.hash.slice(1);
    var loading = document.getElementById('loading');
    var fallback = document.getElementById('fallback');
    var retry = document.getElementById('retry');

    function showFallback() {
      loading.style.display = 'none';
      fallback.style.display = 'block';
    }

    if (!token) {
      set('fallback-title', T.invalidTitle);
      set('fallback-sub', '');
      set('explain', T.invalid);
      retry.style.display = 'none';
      showFallback();
      return;
    }

    var deepLink = 'recipeextractor://import-shared?token=' + encodeURIComponent(token);
    retry.setAttribute('href', deepLink);

    location.href = deepLink;
    setTimeout(showFallback, 2000);
  })();
</script>
</body>
</html>
